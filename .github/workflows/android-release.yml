
name: Build SKYNET Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete SKYNET project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.skynet --project-name skynet .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload SKYNET APK
        uses: actions/upload-artifact@v4
        with:
          name: SKYNET-RELEASE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
